name: Extrair source2022.zip com segurança



on:

  workflow_dispatch:
  


permissions:

  contents: write
  


jobs:

  extrair-e-publicar:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Baixar o repositório
      
        uses: actions/checkout@v4
        
      - name: Baixar e extrair a source
      
        run: |
        
          curl -L --fail -o source.zip "https://github.com/nkzshawty/FreeFire2022SourceFull/releases/download/v1.0.0/source2022.zip"
          
          rm -rf extracted
          
          mkdir extracted
          
          unzip -q source.zip -d extracted
          
          top_count=$(find extracted -mindepth 1 -maxdepth 1 | wc -l)
          
          if [ "$top_count" = "1" ] && [ -d "$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)" ]; then
          
            cp -a "$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)"/. .
            
          else
          
            cp -a extracted/. .
            
          fi
          
      - name: Remover credenciais e publicar
      
        run: |
        
          find . -type f \( -name '.env' -o -name '.env.*' -o -iname '*.pem' -o -iname '*.key' -o -iname '*credentials*' -o -iname '*secret*' \) -not -path './.git/*' -delete
          
          rm -rf extracted source.zip .github/workflows/import-source.yml
          
          git lfs install
          
          find . -type f -size +95M -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do git lfs track "$f"; done
          
          git config user.name "github-actions[bot]"
          
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .gitattributes
          
          git add -A
          
          git commit -m "Publicar source extraida sem credenciais" || exit 0
          
          git push





























